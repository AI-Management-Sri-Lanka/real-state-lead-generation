version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: real_estate_db
    restart: always
    environment:
      POSTGRES_USER: postgres      
      POSTGRES_PASSWORD: 12345678   
      POSTGRES_DB: real_estate_dev_db 
 
    ports:
      - "5432:5432"
      
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: