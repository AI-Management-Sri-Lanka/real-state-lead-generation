version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: real_estate_db
    restart: always
    environment:
      POSTGRES_USER: postgres      
      POSTGRES_PASSWORD: 12345678   
      POSTGRES_DB: real_estate_dev_db 
 
    ports:
      - "5432:5432"
      
    volumes:
      - postgres_data:/var/lib/postgresql/data

  vector_db:
    image: qdrant/qdrant
    container_name: qdrant_db
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: